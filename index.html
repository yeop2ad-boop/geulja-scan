<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1f8f5f">
<title>글자스캔정리</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="stylesheet" href="style.css">
</head>
<body>
<header class="top">
  <div class="brand"><span class="logo">▦</span> 글자스캔정리</div>
  <div class="tabs">
    <button class="tab active">1 패턴정리</button>
    <button class="tab disabled" disabled>2 준비중</button>
  </div>
</header>

<main>
  <!-- 프로젝트 목록 -->
  <section id="homeView">
    <button class="btn primary big full" id="newProjBtn">＋ 새 프로젝트</button>
    <p class="hint left">프로젝트에 사진을 여러 장 넣으면 한꺼번에 패턴을 찾고,<br>같은 패턴끼리 합쳐서 엑셀·문서로 정리해요.</p>
    <div id="projList"></div>
  </section>

  <!-- 프로젝트 화면 -->
  <section id="projView" hidden>
    <div class="proj-head">
      <button class="btn small" id="backBtn">← 목록</button>
      <input id="projName" class="proj-name">
      <button class="x" id="delProjBtn" title="프로젝트 삭제">🗑</button>
    </div>
    <div class="add-btns">
      <label class="btn primary">📷 사진 찍기
        <input type="file" id="camInput" accept="image/*" capture="environment" hidden>
      </label>
      <label class="btn">🖼 사진 여러 장 추가
        <input type="file" id="fileInput" accept="image/*" multiple hidden>
      </label>
    </div>
    <div id="queueInfo" class="queue" hidden></div>
    <div id="items"></div>

    <div id="resultBox" hidden>
      <div class="seg">
        <button class="segbtn active" data-mode="merged">같은 패턴 합치기</button>
        <button class="segbtn" data-mode="photo">사진별 보기</button>
      </div>
      <div id="repeats" class="repeats"></div>
      <div id="sections"></div>
      <div class="export-bar">
        <button class="btn primary" id="xlsxBtn">엑셀로 저장</button>
        <button class="btn" id="docBtn">문서(Word)로 저장</button>
        <button class="btn" id="copyBtn">복사</button>
      </div>
    </div>
  </section>
</main>

<script src="https://cdn.jsdelivr.net/npm/tesseract.js@5.1.1/dist/tesseract.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
<script src="analyze.js"></script>
<script src="app.js"></script>
</body>
</html>
