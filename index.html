<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#000000">
<title>글자스캔정리</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="app">

  <!-- 카메라: 가운데 반투명 띠 + 빨간 선 안의 글자만 읽어요 -->
  <section id="cam">
    <video id="video" playsinline muted autoplay></video>
    <div id="band">
      <i id="redline"></i>
      <b class="grip" id="gripL" aria-label="왼쪽 끝 조절"></b>
      <b class="grip" id="gripR" aria-label="오른쪽 끝 조절"></b>
    </div>
    <div class="cam-top">
      <span id="status" class="pill">엔진 준비 중…</span>
      <div class="cam-tools">
        <button id="torch" class="ico" hidden>플래시</button>
        <button id="zoomBtn" class="ico" hidden>1×</button>
      </div>
    </div>
    <div id="toast"></div>
    <div class="cam-bottom">
      <span id="last" class="last">읽은 글자가 여기 나와요</span>
      <div class="cam-btns">
        <button id="bandMinus" class="ico" aria-label="줄 높이 줄이기">줄 −</button>
        <button id="bandPlus" class="ico" aria-label="줄 높이 늘리기">줄 ＋</button>
        <button id="undo" class="ico" aria-label="방금 입력 취소">↶ 취소</button>
      </div>
    </div>
    <div id="nocam" hidden>
      <p>카메라를 쓸 수 없어요.<br>권한을 허용하거나, 사진으로 읽어 보세요.</p>
      <label class="btn">사진으로 읽기<input type="file" id="fileIn" accept="image/*" capture="environment" hidden></label>
    </div>
  </section>

  <!-- 셔터 -->
  <div id="bar">
    <div class="opt">
      <small>띄어쓰기</small>
      <div class="seg2" id="optSpace">
        <button data-sp="keep" class="on">포함</button>
        <button data-sp="strip">빼고</button>
      </div>
    </div>
    <button id="shutter" aria-label="촬영해서 글자 입력"></button>
    <div class="opt">
      <small>읽을 내용</small>
      <div class="seg2" id="optKind">
        <button data-kind="text">글자만</button>
        <button data-kind="num">숫자만</button>
        <button data-kind="all" class="on">전체</button>
      </div>
    </div>
  </div>

  <!-- 메모장 / 엑셀 선택 -->
  <nav class="tabs">
    <button data-mode="memo" class="on">메모장</button>
    <button data-mode="excel">엑셀</button>
  </nav>

  <section id="p-memo" class="panel">
    <textarea id="memo" placeholder="셔터를 누르면 읽은 글자가 옆으로 이어서 적혀요" spellcheck="false"></textarea>
    <div class="tools">
      <button id="mNl">줄바꿈 ↵</button>
      <button id="mCopy">복사</button>
      <button id="mSave">저장(.txt)</button>
      <button id="mClear" class="warn">지우기</button>
    </div>
  </section>

  <section id="p-excel" class="panel" hidden>
    <div id="gridWrap"><table id="grid"></table></div>
    <div class="tools">
      <button id="eDir">다음 칸: 아래 ↓</button>
      <button id="eNext">다음 줄 ↵</button>
      <button id="eColP">열 ＋</button>
      <button id="eColM">열 －</button>
      <button id="eCopy">복사</button>
      <button id="eSave">엑셀 저장</button>
      <button id="eClear" class="warn">지우기</button>
    </div>
  </section>
</div>

<script src="https://cdn.jsdelivr.net/npm/tesseract.js@5.1.1/dist/tesseract.min.js"></script>
<script src="app.js"></script>
</body>
</html>
