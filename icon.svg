    <path d="M304 150V112h38M416 150V112h-38M304 266v38h38M416 266v38h-38" fill="none" stroke="#1d4fd8" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
    <!-- 셔터 -->
    <circle cx="360" cy="334" r="12" fill="none" stroke="#1d4fd8" stroke-width="3"/><circle cx="360" cy="334" r="7" fill="#1d4fd8"/>
  </g>
  </g>
</svg>
